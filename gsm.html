<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#1a3a5c"/>
<title>Verbruggen Planning</title>
<style>
:root{--bleu:#1a3a5c;--bleu2:#2563eb;--r:12px;--sh:0 2px 12px rgba(0,0,0,.12);--bd:#e2e8f0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f4f8;color:#1e293b;display:flex;flex-direction:column}
button,input,select{font-family:inherit}
button{cursor:pointer}
input,select{font-size:14px}

/* LOGIN */
#login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#1a3a5c 0%,#2563eb 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;padding:20px}
#login-screen.hidden{display:none}
.login-logo{font-size:52px;margin-bottom:10px}
.login-title{color:#fff;font-size:24px;font-weight:800;margin-bottom:2px;letter-spacing:-.5px}
.login-sub{color:rgba(255,255,255,.7);font-size:13px;margin-bottom:28px}
.login-card{background:#fff;border-radius:18px;padding:22px;width:100%;max-width:360px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.login-card h3{font-size:15px;font-weight:700;color:var(--bleu);margin-bottom:14px;text-align:center}
.role-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.role-btn{padding:14px 6px;border-radius:10px;border:2px solid var(--bd);background:#fff;font-size:12px;font-weight:700;color:#64748b;text-align:center;transition:all .2s}
.role-btn.active{border-color:var(--bleu2);background:#eff6ff;color:var(--bleu2)}
.role-btn .icon{font-size:26px;display:block;margin-bottom:4px}
#user-list{display:none;flex-direction:column;gap:6px;margin-bottom:14px;max-height:250px;overflow-y:auto}
.user-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:2px solid var(--bd);transition:all .2s}
.user-item.selected{border-color:var(--bleu2);background:#eff6ff}
.user-avatar-sm{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;flex-shrink:0}
.user-name{font-weight:700;font-size:14px;flex:1}
.user-group{font-size:10px;color:#94a3b8;font-weight:600}
.pin-status{font-size:11px;margin-left:auto}
#pin-section{display:none;flex-direction:column;gap:8px;margin-bottom:14px}
.pin-display{display:flex;justify-content:center;gap:10px;margin-bottom:10px}
.pin-dot{width:14px;height:14px;border-radius:50%;background:#e2e8f0;transition:all .15s}
.pin-dot.filled{background:var(--bleu2);transform:scale(1.1)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pin-btn{padding:16px;border-radius:10px;border:1.5px solid var(--bd);background:#fff;font-size:20px;font-weight:700;color:#1e293b;text-align:center}
.pin-btn:active{background:#e2e8f0}
.pin-error{color:#dc2626;font-size:12px;text-align:center;min-height:18px;font-weight:600}
.pin-hint{color:#94a3b8;font-size:11px;text-align:center;margin-top:4px}
.btn-login{width:100%;padding:14px;border-radius:10px;border:none;background:var(--bleu);color:#fff;font-size:15px;font-weight:700}
.btn-login:disabled{opacity:.35;cursor:not-allowed}

/* APP */
#app{display:none;flex-direction:column;height:100%}
#app.show{display:flex}
#hdr{background:var(--bleu);color:#fff;padding:6px 8px;display:flex;align-items:center;gap:6px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#hdr h1{font-size:12px;font-weight:700;flex:1}
.wnav{display:flex;align-items:center;gap:5px}
.wnav button{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:5px;padding:2px 7px;font-size:12px}
#winfo{font-size:9px;color:rgba(255,255,255,.75);text-align:center;min-width:68px}
#user-badge{background:rgba(255,255,255,.2);border-radius:20px;padding:2px 8px;font-size:10px;font-weight:600;white-space:nowrap;flex-shrink:0}
#tabs{display:flex;background:#fff;border-bottom:2px solid var(--bd);flex-shrink:0;overflow-x:auto}
#tabs button{flex:1;padding:8px 4px;border:none;background:none;font-size:10px;font-weight:700;color:#64748b;border-bottom:3px solid transparent;white-space:nowrap;min-width:72px}
#tabs button.on{color:var(--bleu2);border-bottom-color:var(--bleu2)}
#content{flex:1;overflow:hidden;display:flex;flex-direction:column}
.view{display:none;flex:1;overflow:hidden;flex-direction:column}
.view.on{display:flex}
.week-hint{font-size:10px;color:#64748b;padding:6px 8px;background:#f8fafc;border-bottom:1px solid var(--bd);flex-shrink:0}
.table-wrap{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}

/* Planning table */
#ptbl{border-collapse:collapse;min-width:1100px;width:100%}
#ptbl th,#ptbl td{border:1px solid #dbe3ee;vertical-align:top}
#ptbl th{background:#1a3a5c;color:#fff;font-size:11px;padding:7px 5px;position:sticky;top:0;z-index:5}
#ptbl th.pname,#ptbl td.pname{position:sticky;left:0;z-index:6;background:#fff}
#ptbl th.pname{background:#1a3a5c;z-index:7}
#ptbl td.pname{min-width:170px;max-width:170px;width:170px;padding:8px 10px}
#ptbl td.daycell{min-width:145px;max-width:145px;width:145px;padding:6px;cursor:pointer;background:#fff}
#ptbl td.daycell.clip-src{box-shadow:inset 0 0 0 2px #2563eb;background:#eff6ff}
#ptbl td.daycell.clip-ready{outline:1px dashed #bfdbfe;outline-offset:-3px}
#ptbl td.weektotal{min-width:86px;width:86px;padding:8px;text-align:center;font-weight:800;font-size:13px;background:#f8fafc;position:sticky;right:0;z-index:4}
.person-row{border-top:3px solid #cbd5e1}
.person-card{display:flex;align-items:center;gap:8px}
.person-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:12px;flex-shrink:0}
.person-meta b{display:block;font-size:12px;line-height:1.15}
.person-meta span{font-size:10px;font-weight:700}
.daycell-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:10px;color:#64748b;font-weight:700}
.day-total{padding:2px 8px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-size:10px;font-weight:800}
.day-total.warn{background:#fff7ed;color:#c2410c}
.day-total.ok{background:#dcfce7;color:#166534}
.day-bars{height:180px;display:flex;flex-direction:column;gap:8px}
.task-mini{padding:10px 8px;border-radius:8px;font-size:11px;line-height:1.2;border:1px solid transparent;display:flex;align-items:stretch;overflow:hidden;min-height:18px}
.task-mini.task-clip-src{box-shadow:inset 0 0 0 2px #2563eb}
.task-mini:last-child{margin-bottom:0}
.task-mini .tm-wrap{display:flex;flex-direction:column;justify-content:center;min-width:0;width:100%}
.task-mini .tm-main{display:block;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day-gap{flex:1 0 0;border:1px dashed #dbe3ee;border-radius:8px;background:repeating-linear-gradient(-45deg,#f8fafc,#f8fafc 8px,#f1f5f9 8px,#f1f5f9 16px)}
.task-empty{font-size:10px;color:#94a3b8;font-style:italic;padding-top:10px}
.top-actions{display:flex;gap:8px;align-items:center;padding:8px 10px;background:#f0fdf4;border-bottom:1px solid #bbf7d0;flex-wrap:wrap}
.top-actions button{padding:5px 10px;border-radius:8px;border:1px solid #86efac;background:#fff;color:#15803d;font-size:11px;font-weight:700}

/* Mobile day blocks */
#tab-myplan,#tab-pointage,#tab-settings,#tab-export{overflow:auto;-webkit-overflow-scrolling:touch;padding:12px}
#tab-settings{overflow-y:scroll !important}
.day-block,.pt-day,.ex-card,.setting-box{background:#fff;border-radius:var(--r);margin-bottom:10px;overflow:hidden;box-shadow:var(--sh)}
.day-title,.pt-day-title{background:var(--bleu);color:#fff;padding:8px 14px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:8px}
.day-title .r,.pt-day-title .r{margin-left:auto;background:rgba(255,255,255,.2);padding:2px 8px;border-radius:999px;font-size:10px}
.task-row,.pt-row{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-bottom:1px solid #f1f5f9}
.task-row:last-child,.pt-row:last-child{border-bottom:none}
.task-info,.pt-info{flex:1;min-width:0}
.task-info b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-info span{display:block;font-size:11px;color:#6b7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt-info b{display:block;font-size:14px;line-height:1.25;white-space:normal;overflow:visible;text-overflow:clip}
.pt-info span{display:block;font-size:11px;color:#6b7280;white-space:normal;overflow:visible;text-overflow:clip}
.empty-block{padding:14px;color:#94a3b8;font-size:11px;font-style:italic}
.summary-card{background:#fff;border-radius:var(--r);padding:12px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:var(--sh);flex-wrap:wrap}
.summary-actions{display:flex;gap:8px;flex-wrap:wrap}
.summary-card .big{font-size:18px;font-weight:800;color:var(--bleu)}

/* Pointage */
.pointage-wrap{max-width:980px;margin:0 auto}
.pillbar{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--bd);flex-shrink:0}
.pillbar button{padding:6px 12px;border-radius:999px;border:2px solid var(--bd);background:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.pillbar button.on{color:#fff}
.pt-day{background:#fff;border-radius:var(--r);margin-bottom:14px;overflow:hidden;box-shadow:var(--sh)}
.pt-day-title{background:var(--bleu);color:#fff;padding:9px 14px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:8px}
.pt-day-title .r{margin-left:auto;background:rgba(255,255,255,.2);padding:2px 8px;border-radius:999px;font-size:10px}
.pt-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 14px;margin:10px;border:1px solid var(--bd);border-radius:12px;background:#fff}
.pt-row.pt-extra{grid-template-columns:minmax(0,1fr) auto auto}
.pt-row.has-rm{grid-template-columns:minmax(0,1fr) auto auto}
.pt-topline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:0}
.hctrl{display:flex;align-items:center;gap:6px;background:#f8fafc;border:1px solid var(--bd);border-radius:12px;padding:4px}
.hctrl button{width:30px;height:30px;border-radius:8px;border:1px solid var(--bd);background:#fff;font-size:16px;font-weight:900}
.hval{min-width:62px;text-align:center;font-size:15px;font-weight:800;color:var(--bleu)}
.line-actions{padding:0 10px 10px 10px}
.line-actions button{border:1px dashed #94a3b8;background:#f8fafc;color:#64748b;border-radius:10px;padding:8px 12px;font-size:11px;font-weight:700}
.extra-fields{display:grid;grid-template-columns:190px 96px 1fr;gap:8px}
.extra-fields input,.extra-fields select{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font-size:12px;width:100%;background:#fff}
.extra-preset{min-width:0}
.pt-fields{display:grid;grid-template-columns:140px 1fr;gap:8px;margin-top:6px}
.pt-fields input{border:1px solid var(--bd);border-radius:8px;padding:6px 10px;font-size:12px;width:100%;background:#fff;color:#334155}
.pt-fields .pt-lot{font-weight:600;color:var(--bleu)}
.pt-rm-x{color:#dc2626;align-self:start;margin-top:4px;border:1px solid #fecaca;background:#fef2f2;padding:6px 10px;border-radius:8px;font-weight:700}
.hidden-banner{background:#fef9c3;border:1px solid #fde047;color:#854d0e;border-radius:99px;padding:3px 10px;font-size:11px;font-weight:700;cursor:pointer;margin-left:10px}
.hidden-banner:hover{background:#fef08a}
@media (max-width:760px){
  .pointage-wrap{max-width:none}
  .pt-row,.pt-row.pt-extra,.pt-row.has-rm{grid-template-columns:1fr}
  .hctrl{justify-content:flex-end}
  .extra-fields{grid-template-columns:1fr}
  .pt-fields{grid-template-columns:1fr 1fr;gap:6px}
  .pt-fields input{font-size:13px;padding:7px 8px}
}

/* Settings/export */
.setting-box{padding:14px 16px;flex-shrink:0}
.setting-box h3{font-size:14px;color:var(--bleu);margin-bottom:8px}
.setting-box p{font-size:12px;color:#64748b;line-height:1.45;margin-bottom:10px}
.setting-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f1f5f9;flex-wrap:wrap}
.setting-row:last-child{border-bottom:none}
.setting-row .meta{flex:1}
.setting-row .meta b{display:block;font-size:13px}
.setting-row .meta span{font-size:11px;color:#64748b}
.person-editor{display:grid;grid-template-columns:minmax(110px,1fr) 100px 110px minmax(140px,1.2fr) 110px auto;gap:8px;align-items:center;flex:1;min-width:0}
.person-editor-head{font-size:10px;text-transform:uppercase;letter-spacing:.3px;color:#94a3b8;font-weight:700;padding:0 4px}
.setting-row.pers-head{padding:4px 14px 2px;background:transparent;border:none}
.setting-row.pers-head .person-editor-head>div{padding:0 4px}
.toggle-active{display:inline-flex;align-items:center;gap:7px;border:none;border-radius:999px;padding:5px 12px 5px 6px;font-size:12px;font-weight:800;cursor:pointer;transition:all .18s;white-space:nowrap}
.toggle-active .knob{width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle-active.on{background:#16a34a;color:#fff}
.toggle-active.off{background:#cbd5e1;color:#475569}
.toggle-active.off .knob{background:#f1f5f9}
.toggle-active:hover{filter:brightness(.95)}
.row-inactive{opacity:.55}
.row-inactive .person-editor input,.row-inactive .person-editor select{background:#f1f5f9}
.person-editor input,.person-editor select{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font-size:12px;width:100%;background:#fff}
.person-tools{display:flex;gap:8px;flex-wrap:wrap}
.setting-addbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.setting-addbar button{padding:7px 10px;border-radius:999px;border:1px solid #cbd5e1;background:#fff;font-size:11px;font-weight:700}
@media (max-width:980px){.person-editor{grid-template-columns:1fr 1fr}.person-tools{width:100%}}
.pin-tag{font-size:11px;font-weight:800;padding:5px 10px;border-radius:999px;border:1px solid #bfdbfe;background:#eff6ff;color:#1d4ed8}
.mini-btn{padding:6px 10px;border-radius:8px;border:1px solid var(--bd);background:#fff;font-size:11px;font-weight:700}
.main-btn{width:100%;padding:13px;border-radius:10px;border:none;background:var(--bleu);color:#fff;font-weight:700;font-size:14px;margin-bottom:8px}
.add-btn{display:inline-flex;align-items:center;gap:4px;padding:7px 14px;border-radius:8px;border:1.5px dashed #94a3b8;background:#f8fafc;color:var(--bleu);font-weight:700;font-size:12px;cursor:pointer;margin-top:8px}
.add-btn:hover{background:#eff6ff;border-color:var(--bleu2);border-style:solid}
.secondary-btn{width:100%;padding:13px;border-radius:10px;border:2px dashed #94a3b8;background:#f8fafc;color:#64748b;font-weight:700;font-size:14px;margin-bottom:8px}

/* Modals */
#ov,#pin-ov,#hist-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;align-items:flex-end}
#ov.on,#pin-ov.on,#hist-ov.on{display:flex}
#modal,#pin-modal,#hist-modal{background:#fff;border-radius:16px 16px 0 0;width:100%;max-height:92vh;overflow-y:auto;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
#pin-ov,#hist-ov{align-items:center;justify-content:center}
#pin-modal,#hist-modal{border-radius:16px;max-width:360px;padding:22px}
#modal h3,#pin-modal h3,#hist-modal h3{font-size:16px;font-weight:800;color:var(--bleu);margin-bottom:12px}
.editor-summary{background:#f8fafc;border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:12px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px}
.editor-summary .warn{color:#c2410c}
.editor-summary .ok{color:#166534}
.editor-list{display:flex;flex-direction:column;gap:10px}
.editor-summary{align-items:flex-start}
.editor-summary>div:first-child{display:flex;flex-direction:column;gap:4px}
.editor-summary>div:first-child strong{font-size:14px}
.editor-summary-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.editor-sheet{border:1px solid var(--bd);border-radius:12px;background:#fff;overflow:auto}
.editor-row-header,.editor-row{display:grid;grid-template-columns:minmax(155px,1.1fr) 90px 110px minmax(180px,1.4fr) minmax(180px,1.4fr) 250px 38px 38px;gap:8px;align-items:center;min-width:1080px;padding:8px 10px}
.editor-row-header{background:#f8fafc;border-bottom:1px solid var(--bd);font-size:11px;font-weight:800;color:#64748b}
.editor-row{border-bottom:1px solid #f1f5f9}
.editor-row:last-child{border-bottom:none}
.editor-row input,.editor-row select{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;width:100%;font-size:13px;background:#fff}
.editor-row input[disabled]{background:#f8fafc;color:#94a3b8}
.editor-hours-inline input{text-align:center;font-weight:800}
.row-colors{display:flex;align-items:center;gap:4px;flex-wrap:wrap;max-width:242px;padding-bottom:2px}
.row-colors::-webkit-scrollbar{height:4px}
.color-swatch{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid #e2e8f0;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.row-action{width:34px;height:34px;border:none;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800;line-height:1}
.row-action.add{background:#eff6ff;color:#1d4ed8}
.row-action.del{background:#fee2e2;color:#dc2626}
.editor-muted{font-size:12px;color:#94a3b8;text-align:center}
.editor-empty-actions{display:flex;gap:8px;flex-wrap:wrap}
.editor-empty-actions .mini-btn{flex:1;min-width:180px}
.editor-suggestions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.editor-suggestions .lbl{font-size:11px;font-weight:800;color:#64748b}
.suggest-chip{border:1px solid var(--bd);background:#fff;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:700;color:#334155}
.suggest-chip b{color:var(--bleu)}
.editor-tools,.mact,.hist-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.editor-tools button,.mact button,.hist-actions button{flex:1;padding:11px;border-radius:10px;border:none;font-size:13px;font-weight:700}
.hist-list{max-height:55vh;overflow:auto}
.hist-item{padding:10px 0;border-bottom:1px solid #f1f5f9}
.hist-item:last-child{border-bottom:none}
.hist-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:4px}
.hist-by{font-size:12px;font-weight:800;color:#0f172a}
.hist-at{font-size:11px;color:#64748b}
.hist-text{font-size:12px;line-height:1.45}
.hist-empty{color:#94a3b8;font-size:12px;text-align:center;padding:18px}
.pin-modal-display{display:flex;justify-content:center;gap:10px;margin-bottom:12px}
.pm-dot{width:14px;height:14px;border-radius:50%;background:#e2e8f0}
.pm-dot.filled{background:var(--bleu2);transform:scale(1.1)}
#pm-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.pm-btn{padding:15px;border-radius:10px;border:1.5px solid var(--bd);background:#fff;font-size:19px;font-weight:700}
#pm-error{color:#dc2626;font-size:12px;text-align:center;min-height:18px;font-weight:600}
#pm-hint{color:#94a3b8;font-size:11px;text-align:center;margin-bottom:10px}


/* GSM dédié */
.mobile-person-pick{padding:12px;overflow:auto;-webkit-overflow-scrolling:touch}
.mobile-person-grid{display:grid;grid-template-columns:1fr;gap:10px}
.mobile-person-btn{width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;border:2px solid var(--bd);border-radius:14px;background:#fff;box-shadow:var(--sh);text-align:left}
.mobile-person-btn.on{border-color:var(--bleu2);background:#eff6ff}
.mobile-person-btn .meta{flex:1;min-width:0}
.mobile-person-btn .meta b{display:block;font-size:14px}
.mobile-person-btn .meta span{display:block;font-size:11px;color:#64748b}

function sanitizeEmailKey(email){return String(email||'').toLowerCase().replace(/[.@#$\[\]\/]/g,'_');}
function ensureBureauRole(user){
  return new Promise(function(resolve){
    var email=String(user.email||'').toLowerCase(); if(!email||!db){resolve(null); return;}
    var key=sanitizeEmailKey(email);
    db.ref('data/userRoles/'+key).once('value').then(function(snap){
      var v=snap.val();
      if(v && (v.role==='admin'||v.role==='chef')) { resolve(v.role); return; }
      var initRole=INITIAL_EMAIL_ROLES[email];
      if(initRole==='admin'||initRole==='chef'){
        var entry={email:email,role:initRole,nom:email.split('@')[0]};
        db.ref('data/userRoles/'+key).set(entry).catch(function(){});
        resolve(initRole); return;
      }
      var p=personByEmail(email);
      if(p) { resolve('personnel'); return; }
      resolve(null);
    }).catch(function(){resolve(null);});
  });
}
function initFirebase(){
  try{
    var firebaseConfig={
      apiKey:"AIzaSyAuXW6oBiNPw4W4lZoLPqjpVlLLwA6rt5Q",
      authDomain:"verbruggen-planning.firebaseapp.com",

    };
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    db=firebase.database();
    fbAuth=firebase.auth();
    fbAuth.onAuthStateChanged(function(user){
      if(user){
        bureauUser=user;
        ensureBureauRole(user).then(function(r){
          if(r){
            role=r;
            if(r==='personnel'){
              var p=personByEmail(user.email||'');
              if(p) userId=p.id; else { fbAuth.signOut(); return; }
            } else {
              userId='bureau_'+user.uid;
            }

            if(ls && !ls.classList.contains('hidden')){
              ls.classList.add('hidden');

              buildTabs(); if(!currentTab) currentTab=isManager()?'planning':'pointage'; renderCurrentTab(); updateStatusBar();
            } else { updateStatusBar(); }
          }
        });
      } else {
        bureauUser=null;
      }
    });
    db.ref('.info/connected').on('value', function(snap){
      fbConnected=snap.val()===true;
      var badge=document.getElementById('fb-status');
      if(badge){badge.textContent=fbConnected?'🟢':'🔴';badge.title=fbConnected?'Firebase connecté':'Hors ligne';}
    });
    fbListen();
  }catch(e){console.warn('Firebase init error',e);}
}
function fbSave(){
  if(!db||!fbConnected) return;
  ignoreRemoteUntil=Date.now()+1500;
  try{
    db.ref('data').set({
      planning:planning,
      pointage:pointage,
      planningBureau:planningBureau,
      pointageBureau:pointageBureau,
      cColorOverride:cColorOverride,
      people:PERS,
      personPins:personPins,
      chefUsers:chefUsers,
      meta:appMeta
    });
  }catch(e){}
}
var ignoreRemoteUntil=0;
function fbListen(){
  if(!db) return;
  db.ref('data').on('value', function(snap){
    if(Date.now()<ignoreRemoteUntil) return;
    var val=snap.val(); if(!val) return;
    if(val.planning) planning=val.planning;
    if(val.pointage) pointage=val.pointage;
    if(val.planningBureau) planningBureau=val.planningBureau; else planningBureau={};
    if(val.pointageBureau) pointageBureau=val.pointageBureau; else pointageBureau={};
    if(val.extraPointage) legacyExtraPointage=val.extraPointage;
    if(val.cColorOverride) cColorOverride=val.cColorOverride;
    if(val.people) PERS=val.people;
    if(val.personPins) personPins=val.personPins;
    if(val.chefUsers) chefUsers=val.chefUsers;
    else if(val.chefPin) chefUsers=[{id:'chef_main',nom:'Chef principal',pin:padPin(val.chefPin)||DEFAULT_CHEF_PIN}];
    if(val.meta) appMeta=ensureMeta(val.meta);
    migrateState();
    lsSave();
    updateStatusBar();
    renderHistoryIfOpen();
    if(currentTab) renderCurrentTab();
  });
}

function isoWeek(d){var t=new Date(d);t.setHours(0,0,0,0);t.setDate(t.getDate()+3-(t.getDay()+6)%7);var w1=new Date(t.getFullYear(),0,4);return 1+Math.round(((t-w1)/86400000-(3-(w1.getDay()+6)%7))/7);}
function fmtD(d,s){if(s)return d.toLocaleDateString('fr-BE',{day:'2-digit',month:'2-digit'});return d.toLocaleDateString('fr-BE',{weekday:'short',day:'2-digit',month:'2-digit'});}
function fmtDT(ts){if(!ts)return '';return new Date(ts).toLocaleString('fr-BE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}

function pinfo(id){for(var i=0;i<PERS.length;i++)if(PERS[i].id===id)return PERS[i];return {id:id||'',nom:id||'',g:'B',poste:''};}

function chefRole(id){var c=chefInfo(id); return c?(c.role||'chef'):'';}
function adminCount(){return chefUsers.filter(function(c){return c.role==='admin';}).length;}
function isAdmin(){return role==='admin';}
function isManager(){return role==='admin'||role==='chef';}
function tinfo(id){for(var i=0;i<TYPES.length;i++)if(TYPES[i].id===id)return TYPES[i];return{id:id,lbl:id,col:'#64748b'};}
function tcol(id){return GCOL[id]||'#64748b';}
function roundQuarter(v){v=parseFloat(v)||0;return Math.round(v*4)/4;}
function uid(){return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function clone(v){return v==null?null:JSON.parse(JSON.stringify(v));}
function escAttr(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function sameJSON(a,b){return JSON.stringify(a==null?null:a)===JSON.stringify(b==null?null:b);}
function padPin(v,len){v=String(v||'').replace(/\D/g,'');return v.slice(0,len||PIN_LENGTH);}
function pinLen(){return (role==='admin'||role==='chef')?CHEF_PIN_LENGTH:PIN_LENGTH;}
function fmtH(v){v=roundQuarter(v);var s=v.toFixed(2).replace('.',',');s=s.replace(/,00$/,'').replace(/(,\d)0$/,'$1');return s+' h';}
function fmtHShort(v){return fmtH(v).replace(' ','');}
function ensureMeta(meta){meta=meta||{};return {lastModifiedAt:meta.lastModifiedAt||null,lastModifiedBy:meta.lastModifiedBy||'',history:Array.isArray(meta.history)?meta.history:[]};}
function currentDisplayName(){if(bureauUser){var em=bureauUser.email||''; var nm=em.split('@')[0]||em; return nm.charAt(0).toUpperCase()+nm.slice(1);} if(isManager()&&userId){var c=chefInfo(userId);return c?c.nom:'Chef';} if(role==='personnel'&&userId){return pinfo(userId).nom;} return 'Système';}
function taskSignature(t){return [t.type||'',t.num||'',t.nom||'',t.mbl||'',t.colorIdx==null?'':t.colorIdx].join('|');}
function sanitizeTask(t){t=t||{};var type=t.type||'P';var noC=NOCH[type];var h=Math.max(0,roundQuarter(t.h));return {id:t.id||uid(),type:type,num:noC?'':String(t.num||'').trim(),nom:noC?'':String(t.nom||'').trim(),mbl:noC?'':String(t.mbl||'').trim(),h:h,colorIdx:(t.colorIdx===0||t.colorIdx)?parseInt(t.colorIdx,10):((!noC&&t.num&&cColorOverride[t.num]!==undefined)?cColorOverride[t.num]:null)};}
function taskDesc(t){if(!t) return 'vide'; if(NOCH[t.type]) return t.type+' · '+tinfo(t.type).lbl+' · '+fmtH(t.h); var arr=[t.type]; if(t.num)arr.push(t.num); if(t.nom)arr.push(t.nom); if(t.mbl)arr.push(t.mbl); arr.push(fmtH(t.h)); return arr.join(' · ');}
function taskColor(t){if(!t) return {bg:'#fff',fg:'#334155',brd:'#cbd5e1'}; if(NOCH[t.type]) return NOCH_COLOR[t.type]; if(t.colorIdx!==undefined&&t.colorIdx!==null&&PALETTE[t.colorIdx]) return PALETTE[t.colorIdx%PALETTE.length]; if(t.num&&cColorOverride[t.num]!==undefined) return PALETTE[cColorOverride[t.num]%PALETTE.length]; return {bg:'#f8fafc',fg:tinfo(t.type).col,brd:tinfo(t.type).col};}
function defaultTypeForPerson(pid){
  var p=pinfo(pid);
  var dt=(p.defaultType||'').toUpperCase();
  if(dt&&tinfo(dt)&&tinfo(dt).id===dt){
    if(isBureauContext() && !BUREAU_TYPES[dt] && !NOCH[dt]) return 'E';
    if(!isBureauContext() && BUREAU_TYPES[dt]) return 'P';
    return dt;
  }
  if(isBureauContext()) return 'E';
  var g=(p.g||'').toUpperCase();
  if(g==='B') return 'B';
  if(g==='G') return 'G';
  for(var i=0;i<TYPES.length;i++) if(TYPES[i].id===g&&!NOCH[g]) return g;
  return 'P';
}

function sectionLabel(g){g=String(g||'').toUpperCase(); var m={M:'Machine',A:'Atelier',F:'Finition',T:'Transport',P:'Pose',G:'Magasin',B:'Bureau'}; return m[g]||g||'';}
function activePeople(){return PERS.filter(function(p){return p && p.active!==false;});}
function archivedPeople(){return PERS.filter(function(p){return p && p.active===false;});}
function sortPeople(){var order={M:1,A:2,F:3,T:4,P:5,G:6,B:7}; PERS.sort(function(a,b){var aa=(a&&a.active!==false)?0:1, bb=(b&&b.active!==false)?0:1; if(aa!==bb) return aa-bb; var ag=order[(a.g||'').toUpperCase()]||99, bg=order[(b.g||'').toUpperCase()]||99; if(ag!==bg) return ag-bg; return String(a.nom||'').localeCompare(String(b.nom||''),'fr',{sensitivity:'base'});});}
// Sections valides pour les personnes
var VALID_SECTIONS={M:1,A:1,F:1,T:1,P:1,G:1,B:1};
function normalizePerson(p,i){p=p||{}; var g=String(p.g||'P').toUpperCase(); if(!VALID_SECTIONS[g]) g='P'; var dt=String(p.defaultType||'').toUpperCase(); if(dt&&!(tinfo(dt)&&tinfo(dt).id===dt)) dt=''; var email=String(p.email||'').trim().toLowerCase(); return {id:p.id||('pers_'+i+'_'+Date.now().toString(36)), nom:String(p.nom||('Personne '+(i+1))).trim(), g:g, poste:String(p.poste||sectionLabel(g)).trim(), gsm:String(p.gsm||'').trim(), email:email, defaultType:dt, active:p.active!==false};}
function personByEmail(email){if(!email) return null; email=String(email).toLowerCase(); for(var i=0;i<PERS.length;i++){if(PERS[i].email && PERS[i].email===email && PERS[i].active!==false) return PERS[i];} return null;}
function makePersonId(name){return 'pers_'+String(name||'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,18)+'_'+Date.now().toString(36).slice(-4);}
function manualSave(label){lsSave(); fbSave(); updateStatusBar(); toast((label||'Données')+' sauvegardé');}
function weekChantierCatalog(){
  var out=[], seen={}, w=wkKey(), P=activePlanningStore(), pw=P[w]||{};
  Object.keys(pw).forEach(function(pid){
    Object.keys(pw[pid]||{}).forEach(function(di){
      getDayTasks(pid,di).forEach(function(t){
        if(NOCH[t.type]) return;
        var num=String(t.num||'').trim(), nom=String(t.nom||'').trim();
        if(!num && !nom) return;
        var key=[num,nom].join('|');
        if(seen[key]) return;
        seen[key]=1;
        out.push({num:num,nom:nom,mbl:String(t.mbl||'').trim(),type:t.type||''});
      });
    });
  });
  out.sort(function(a,b){return (a.num||'').localeCompare(b.num||'','fr',{numeric:true,sensitivity:'base'}) || (a.nom||'').localeCompare(b.nom||'','fr',{sensitivity:'base'});});
  return out;
}
function weekChantierLabel(it){var parts=[]; if(it.num) parts.push(it.num); if(it.nom) parts.push(it.nom); return parts.join(' — ')||'Chantier';}
function selectedWeekChantierIndex(it){var list=weekChantierCatalog(); for(var i=0;i<list.length;i++){if((list[i].num||'')===String(it.num||'').trim() && (list[i].nom||'')===String(it.nom||'').trim()) return i;} return '';}
function recentTaskTemplates(limit){
  limit=limit||8;
  var P=activePlanningStore();
  var weeks=Object.keys(P||{}).sort().reverse(), out=[], seen={};
  for(var wi=0; wi<weeks.length && out.length<limit; wi++){
    var w=weeks[wi], pw=P[w]||{}, pids=Object.keys(pw);
    for(var pi=0; pi<pids.length && out.length<limit; pi++){
      var pid=pids[pi], days=pw[pid]||{}, dis=Object.keys(days).sort(function(a,b){return parseInt(b,10)-parseInt(a,10);});
      for(var di=0; di<dis.length && out.length<limit; di++){
        var raw=days[dis[di]]||{}, arr=Array.isArray(raw.tasks)?raw.tasks:legacySlotsToTasks(raw);
        for(var ti=0; ti<arr.length && out.length<limit; ti++){
          var t=sanitizeTask(arr[ti]);
          if(NOCH[t.type]) continue;
          var sig=[t.type,t.num,t.nom,t.mbl,t.colorIdx==null?'':t.colorIdx,roundQuarter(t.h)].join('|');
          if(seen[sig]) continue;
          seen[sig]=1;
          out.push({type:t.type,num:t.num,nom:t.nom,mbl:t.mbl,h:t.h||0.25,colorIdx:t.colorIdx});
        }
      }
    }
  }
  return out;
}
function pushUndo(label){
  undoStack.push({label:label||'dernière action',planning:clone(planning),pointage:clone(pointage),planningBureau:clone(planningBureau),pointageBureau:clone(pointageBureau),legacyExtraPointage:clone(legacyExtraPointage),cColorOverride:clone(cColorOverride),appMeta:clone(appMeta)});
  if(undoStack.length>30) undoStack.shift();
  updateStatusBar();
}
function undoLast(){
  if(!undoStack.length){toast('Rien à annuler'); return false;}
  var s=undoStack.pop();
  planning=s.planning||{};
  pointage=s.pointage||{};
  planningBureau=s.planningBureau||{};
  pointageBureau=s.pointageBureau||{};
  legacyExtraPointage=s.legacyExtraPointage||{};
  cColorOverride=s.cColorOverride||{};
  appMeta=ensureMeta(s.appMeta||{});
  closeDayModal();
  clearDayClipboard(true);
  lsSave(); fbSave(); updateStatusBar(); renderHistoryIfOpen(); if(currentTab) renderCurrentTab();
  toast('↶ Annulation : '+(s.label||'dernière action'));
  return true;
}
function plannedDayTotal(pid,di){var arr=getDayTasks(pid,di);var s=0;for(var i=0;i<arr.length;i++)s+=roundQuarter(arr[i].h);return roundQuarter(s);}
function plannedWeekTotal(pid){var s=0;for(var di=0;di<6;di++)s+=plannedDayTotal(pid,di);return roundQuarter(s);}
function pointageDayTotal(pid,di){var day=getPointageDay(pid,di);var s=0;if(day){(day.items||[]).forEach(function(it){s+=roundQuarter(it.h);});(day.extras||[]).forEach(function(it){s+=roundQuarter(it.h);});}return roundQuarter(s);}
function pointageWeekTotal(pid){var s=0;for(var di=0;di<6;di++)s+=pointageDayTotal(pid,di);return roundQuarter(s);}

function addHistoryEntry(text,before,after){
  appMeta=ensureMeta(appMeta);
  var entry={at:new Date().toISOString(),by:currentDisplayName(),text:text,before:before||null,after:after||null};
  appMeta.history.unshift(entry);
  if(appMeta.history.length>250) appMeta.history=appMeta.history.slice(0,250);
  appMeta.lastModifiedAt=entry.at;
  appMeta.lastModifiedBy=entry.by;
}
function updateStatusBar(){
  var su=document.getElementById('sb-user'), sl=document.getElementById('sb-last'), sw=document.getElementById('sb-week'), sc=document.getElementById('sb-clip'), hb=document.getElementById('hist-btn'), ub=document.getElementById('undo-btn');
  if(su) su.textContent='👤 Utilisateur : '+(userId?currentDisplayName():'non connecté');
  if(sl) sl.textContent=appMeta.lastModifiedAt?'🕘 Dernière modification : '+fmtDT(appMeta.lastModifiedAt)+' — '+(appMeta.lastModifiedBy||''):'🕘 Dernière modification : aucune';
  if(sw&&wkMon) sw.textContent='📅 Semaine : n° '+isoWeek(wkMon)+' ('+fmtD(wkMon,true)+' – '+fmtD(dayDate(5),true)+')';
  if(sc){
    if(dayClipboard&&dayClipboard.mode==='task'&&dayClipboard.task) sc.textContent='📋 Presse-papiers : tâche copiée — cliquez une autre date pour coller';
    else if(dayClipboard&&dayClipboard.mode==='day'&&dayClipboard.tasks&&dayClipboard.tasks.length) sc.textContent='📋 Presse-papiers : '+(dayClipboard.label||'journée copiée')+' — cliquez une autre date pour coller';
    else sc.textContent='📋 Presse-papiers : vide';

  if(hb) hb.style.display=(isManager()&&userId)?'inline-flex':'none';
  if(ub){ub.style.display=(isManager()&&userId)?'inline-flex':'none'; ub.disabled=!undoStack.length; ub.style.opacity=undoStack.length?'1':'.45';}
}

function doHardReload(){
  if(!confirm('Recharger l\'application pour récupérer la dernière version ?\n\nVos données ne seront pas perdues (elles sont sur Firebase).')) return;
  // Try to clear all caches (service worker style)
  if('caches' in window){
    caches.keys().then(function(keys){
      keys.forEach(function(k){caches.delete(k);});
    }).finally(function(){
      window.location.reload(true);
    });
  } else {
    window.location.reload(true);
  }
}

// ── MIGRATION / DATA HELPERS ────────────────────────────────
function migrateState(){
  if(!Array.isArray(PERS)||!PERS.length) PERS=JSON.parse(JSON.stringify(DEFAULT_PERS));
  PERS=PERS.map(function(p,i){return normalizePerson(p,i);});
  sortPeople();
  if(!Array.isArray(chefUsers)||!chefUsers.length) chefUsers=clone(DEFAULT_CHEF_USERS);
  chefUsers=chefUsers.map(function(c,i){
    var r=(c.role==='admin'||c.role==='chef')?c.role:(i===0?'admin':'chef');
    var p=padPin(c.pin||'',CHEF_PIN_LENGTH);
    if(p.length!==CHEF_PIN_LENGTH) p=DEFAULT_CHEF_PIN;
    return {id:c.id||('chef_'+i),nom:String(c.nom||('Chef '+(i+1))),pin:p,role:r};
  });
  if(!chefUsers.some(function(c){return c.role==='admin';})) chefUsers[0].role='admin';
  Object.keys(personPins||{}).forEach(function(k){personPins[k]=padPin(personPins[k],PIN_LENGTH);});
  appMeta=ensureMeta(appMeta);
}
function cleanupPlanningPath(w,pid,di){
  var P=activePlanningStore();
  if(P[w]&&P[w][pid]&&P[w][pid][di]&&Object.keys(P[w][pid][di]).length===0) delete P[w][pid][di];
  if(P[w]&&P[w][pid]&&Object.keys(P[w][pid]).length===0) delete P[w][pid];
  if(P[w]&&Object.keys(P[w]).length===0) delete P[w];
}
function getRawPlanningDay(pid,di,create){
  var P=activePlanningStore();
  var w=wkKey(); di=parseInt(di,10);
  if(!P[w]){if(!create)return null; P[w]={};}
  if(!P[w][pid]){if(!create)return null; P[w][pid]={};}
  if(!P[w][pid][di]){if(!create)return null; P[w][pid][di]={};}
  return P[w][pid][di];
}
function legacySlotsToTasks(dayObj){
  var out=[];
  LEGACY_SLOTS.forEach(function(per){
    var s=dayObj&&dayObj[per]; if(!s) return;
    var t=sanitizeTask({id:uid(),type:s.type||'P',num:s.num||'',nom:s.nom||'',mbl:s.mbl||'',h:2,colorIdx:(s.colorIdx===0||s.colorIdx)?s.colorIdx:(s.num&&cColorOverride[s.num]!==undefined?cColorOverride[s.num]:null)});
    if(out.length&&taskSignature(out[out.length-1])===taskSignature(t)) out[out.length-1].h=roundQuarter(out[out.length-1].h+2); else out.push(t);
  });
  return out;
}
function getDayTasks(pid,di){
  var day=getRawPlanningDay(pid,di,false); if(!day) return [];
  if(Array.isArray(day.tasks)) return day.tasks.map(sanitizeTask).filter(function(t){return t.h>0;});
  return legacySlotsToTasks(day);
}
function setDayTasks(pid,di,tasks,opts){
  tasks=(tasks||[]).map(sanitizeTask).filter(function(t){return t.h>0;});
  var prev=getDayTasks(pid,di);
  if(sameJSON(prev,tasks)) return false;
  opts=opts||{};
  if(!opts.skipUndo) pushUndo(opts.undoLabel||('Planning — '+pinfo(pid).nom+' '+DAYS[di]));
  var P=activePlanningStore();
  var w=wkKey(); di=parseInt(di,10);
  if(!P[w]) P[w]={};
  if(!P[w][pid]) P[w][pid]={};
  if(tasks.length) P[w][pid][di]={tasks:tasks}; else delete P[w][pid][di];
  cleanupPlanningPath(w,pid,di);
  syncPointageDay(pid,di,true);
  addHistoryEntry((isBureauContext()?'Planning B.E. : ':'Planning : ')+pinfo(pid).nom+' — '+DAYS[di]+' → '+(tasks.length?tasks.map(taskDesc).join(' / '):'vide'), prev, tasks);
  lsSave(); fbSave(); updateStatusBar(); renderHistoryIfOpen();
  return true;
}
function getLegacySlotFromPointageContext(pid,di,per){
  var day=getRawPlanningDay(pid,di,false); return day&&day[per]?day[per]:null;
}
function getPointageDay(pid,di){
  var w=wkKey(); di=parseInt(di,10);
  var PT=activePointageStore();
  if(!PT[w]) PT[w]={};
  if(!PT[w][pid]) PT[w][pid]={};
  if(!PT[w][pid][di]) PT[w][pid][di]={items:[],extras:[]};
  var day=PT[w][pid][di];
  var isLegacy=false;
  for(var k=0;k<LEGACY_SLOTS.length;k++){if(day[LEGACY_SLOTS[k]]){isLegacy=true; break;}}
  if(isLegacy){
    var legacy=day, items=[];
    LEGACY_SLOTS.forEach(function(per){
      var pt=legacy[per]; if(!pt) return;
      var h=roundQuarter(pt.h); if(h<=0) return;
      var sl=getLegacySlotFromPointageContext(pid,di,per)||{};
      items.push({taskId:'legacy_'+per,type:sl.type||'P',num:sl.num||'',nom:sl.nom||'',mbl:sl.mbl||'',plannedH:2,h:h});
    });
    var lex=[];
    if(legacyExtraPointage[w]&&legacyExtraPointage[w][pid]&&legacyExtraPointage[w][pid][di]){
      lex=(legacyExtraPointage[w][pid][di]||[]).map(function(it){return {num:it.num||'',nom:it.nom||'',mbl:it.mbl||'',h:roundQuarter(it.h||0)};});
    }
    day={items:items,extras:lex};
    activePointageStore()[w][pid][di]=day;
  }
  function toArr(o){
    if(Array.isArray(o)) return o;
    if(o && typeof o==='object'){
      var ks=Object.keys(o).filter(function(k){return /^\d+$/.test(k);}).sort(function(a,b){return parseInt(a,10)-parseInt(b,10);});
      return ks.map(function(k){return o[k];});
    }
    return [];
  }
  day.items=toArr(day.items);
  day.extras=toArr(day.extras);
  return day;
}
function syncPointageDay(pid,di,preserve){
  var day=getPointageDay(pid,di);
  var before=JSON.stringify(day.items||[]);
  var tasks=getDayTasks(pid,di).filter(function(t){return !NOCH[t.type];});
  var map={};
  (day.items||[]).forEach(function(it){if(it.taskId) map[it.taskId]=it;});
  day.items=tasks.map(function(t){
    var old=map[t.id];
    return {taskId:t.id,type:t.type,num:t.num,nom:t.nom,
            mbl:(old&&old.mbl!=null)?old.mbl:(t.mbl||''),
            remarque:(old&&old.remarque)?old.remarque:'',
            hidden:(old&&old.hidden)?true:false,
            plannedH:t.h,h:old?roundQuarter(old.h):roundQuarter(t.h)};
  });
  if(before!==JSON.stringify(day.items||[])){lsSave(); fbSave();}
}
function savePointageDay(pid,di,day,historyText,before,after){
  var w=wkKey();
  var PT=activePointageStore();
  if(!PT[w]) PT[w]={};
  if(!PT[w][pid]) PT[w][pid]={};
  PT[w][pid][di]=day;
  if(historyText) addHistoryEntry(historyText,before,after);
  lsSave(); fbSave(); updateStatusBar(); renderHistoryIfOpen();
}
// ── SYNCHRO POINTAGE → PLANNING (Option C) ───────────────────
function pointageDayToTasks(pid,di){
  var day=getPointageDay(pid,di); var tasks=[];
  (day.items||[]).forEach(function(it){
    var h=roundQuarter(it.h); if(h<=0) return;
    tasks.push(sanitizeTask({type:it.type||'P',num:it.num||'',nom:it.nom||'',mbl:it.mbl||'',h:h,colorIdx:(it.num&&cColorOverride[it.num]!==undefined)?cColorOverride[it.num]:null}));
  });
  var dft=defaultTypeForPerson(pid);
  (day.extras||[]).forEach(function(it){
    var h=roundQuarter(it.h); if(h<=0) return;
    if(!String(it.num||'').trim()&&!String(it.nom||'').trim()) return;
    tasks.push(sanitizeTask({type:dft,num:it.num||'',nom:it.nom||'',mbl:it.mbl||'',h:h,colorIdx:(it.num&&cColorOverride[it.num]!==undefined)?cColorOverride[it.num]:null}));
  });
  return tasks;
}
function applyPointageToPlanning(pid,di){
  var day=getPointageDay(pid,di);
  if(!day||!day.pointed) return false;
  var tasks=pointageDayToTasks(pid,di);
  return setDayTasks(pid,di,tasks,{skipUndo:false,undoLabel:'Synchro pointage → planning'});
}
function validatePointagePerson(pid){
  var n=0; for(var di=0;di<6;di++){ if(applyPointageToPlanning(pid,di)) n++; }
  lsSave(); fbSave(); updateStatusBar(); renderHistoryIfOpen();
  if((currentTab==='planning'||currentTab==='planning_be')) renderPlanning(); if(currentTab==='myplan') renderMyPlan();
  toast(n?('Planning mis à jour ('+n+' jour'+(n>1?'s':'')+')'):'Aucun pointage à reporter');
}
var _lastAutoSyncDate='';
function checkAutoSync(){
  try{
    var now=new Date();
    if(now.getHours()===16 && now.getMinutes()===0){
      var stamp=now.toISOString().slice(0,10);
      if(_lastAutoSyncDate===stamp) return;
      _lastAutoSyncDate=stamp;
      if(!isManager()) return;
      var di=(now.getDay()+6)%7; if(di>5) return;
      var n=0; activePeople().forEach(function(p){ if(applyPointageToPlanning(p.id,di)) n++; });
      if(n){lsSave(); fbSave(); updateStatusBar(); if((currentTab==='planning'||currentTab==='planning_be')) renderPlanning(); toast('Auto-synchro 16h : '+n+' pointage(s) reporté(s)');}
    }
  }catch(e){}
}
setInterval(checkAutoSync,30000);

function onBureauInput(){

function doBureauLogin(){
  var email=document.getElementById('bureau-email').value.trim().toLowerCase();
  var pwd=document.getElementById('bureau-pwd').value;
  var errEl=document.getElementById('bureau-error');
  if(!email||!pwd){errEl.textContent='Email et mot de passe requis'; return;}
  if(!fbAuth){errEl.textContent='Authentification non disponible (réessayez)'; return;}
  document.getElementById('btn-login').disabled=true;
  errEl.textContent='Connexion…';
  fbAuth.signInWithEmailAndPassword(email,pwd).then(function(cred){
    return ensureBureauRole(cred.user).then(function(r){
      if(!r){
        errEl.textContent='Accès refusé : compte non autorisé sur cette application.';
        fbAuth.signOut(); return;
      }
      bureauUser=cred.user; role=r;
      if(r==='personnel'){
        var p=personByEmail(cred.user.email||'');
        userId=p?p.id:null;
        if(!userId){ errEl.textContent='Email non lié à un ouvrier. Demandez à un admin.'; fbAuth.signOut(); return; }
      } else {
        userId='bureau_'+cred.user.uid;
      }
      errEl.textContent='';
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app').classList.add('show');
      if(!wkMon) wkMon=getMonday(new Date());
      buildTabs(); currentTab=currentTab||(isManager()?'planning':'pointage'); renderCurrentTab(); updateStatusBar();
    });
  }).catch(function(err){
    var code=(err&&err.code)||'';
    var msg='Email ou mot de passe incorrect';
    if(code==='auth/too-many-requests') msg='Trop de tentatives. Réessayez plus tard.';
    else if(code==='auth/network-request-failed') msg='Pas de réseau';
    else if(code==='auth/invalid-email') msg='Email invalide';
    errEl.textContent=msg;
    document.getElementById('btn-login').disabled=false;
  });
}

function buildLoginPad(){

function pressLoginPin(v){

function updateLoginPinDisplay(){
  var L=pinLen();
  for(var i=0;i<6;i++){

    d.classList.toggle('filled',i<loginPin.length);
  }

function doLogin(){
  if(!role||!loginSelectedId){toast('Sélectionnez un profil'); return;}

    var c=chefInfo(loginSelectedId);

    if(loginPin!==c.pin){document.getElementById('login-pin-error').textContent='Code PIN incorrect'; loginPin=''; updateLoginPinDisplay(); document.getElementById('btn-login').disabled=true; return;}
    userId=c.id;
    role=(c.role==='admin')?'admin':'chef';
  } else {
    var stored=personPins[loginSelectedId];
    if(!stored){ if(loginPin.length!==PIN_LENGTH) return; personPins[loginSelectedId]=loginPin; addHistoryEntry('Création du PIN personnel pour '+pinfo(loginSelectedId).nom); lsSave(); fbSave(); updateStatusBar(); renderHistoryIfOpen(); toast('PIN créé'); }
    else if(loginPin!==stored){document.getElementById('login-pin-error').textContent='Code PIN incorrect'; loginPin=''; updateLoginPinDisplay(); document.getElementById('btn-login').disabled=true; return;}

function dayTotalClass(v,hasTasks){ if(!hasTasks) return ''; if(Math.abs(v-8)<0.001) return 'ok'; return 'warn'; }
function taskDisplayLabel(t,withHours){
  if(NOCH[t.type]) return tinfo(t.type).lbl + (withHours ? ' ' + fmtHShort(t.h) : '');
  var parts=[];
  if((t.num||'').trim()) parts.push(escAttr(t.num));
  if((t.nom||'').trim()) parts.push(escAttr(t.nom));
  if((t.mbl||'').trim()) parts.push(escAttr(t.mbl));
  if(!parts.length) parts.push('Sans devis');
  if(withHours) parts.push(fmtHShort(t.h));
  return parts.join(' ');
}
function taskMiniHtml(t){
  var c=taskColor(t), txt=taskDisplayLabel(t,true);
  return '<div class="task-mini" style="background:'+c.bg+';color:'+c.fg+';border-color:'+c.brd+'"><div class="tm-wrap"><b class="tm-main">'+txt+'</b></div></div>';
}
function taskMiniProportionalHtml(t,pid,di,taskIndex){
  var c=taskColor(t), txt=taskDisplayLabel(t,true);
  var h=Math.max(0.25,parseFloat(t.h)||0);
  var cls='task-mini'+(sameClipboardSource(pid,di,t.id)?' task-clip-src':'');
  return '<div class="'+cls+'" onclick="return handleTaskBlockClick(event,\''+pid+'\','+di+','+taskIndex+')" style="background:'+c.bg+';color:'+c.fg+';border-color:'+c.brd+';flex:'+h+' 0 0"><div class="tm-wrap"><b class="tm-main">'+txt+'</b></div></div>';
}
function sameClipboardSource(pid,di,taskId){
  return !!(dayClipboard&&dayClipboard.source&&dayClipboard.source.pid===pid&&parseInt(dayClipboard.source.di,10)===parseInt(di,10)&&dayClipboard.source.wk===wkKey()&&(taskId==null||dayClipboard.source.taskId===taskId));
}
function clearDayClipboard(silent){
  if(!dayClipboard) return;
  dayClipboard=null;
  updateStatusBar();
  if((currentTab==='planning'||currentTab==='planning_be')) renderPlanning();
  if(!silent) toast('Presse-papiers annulé');
}
function copyDayTasks(pid,di){
  var tasks=getDayTasks(pid,di);
  if(!tasks.length){toast('Aucune tâche à copier'); return false;}
  dayClipboard={mode:'day',tasks:clone(tasks),source:{pid:pid,di:di,wk:wkKey()},label:pinfo(pid).nom+' — '+DAYS[di]+' '+fmtD(dayDate(di),true)};
  updateStatusBar();
  if((currentTab==='planning'||currentTab==='planning_be')) renderPlanning();
  toast('📋 Journée copiée — cliquez une autre date pour coller');
  return true;
}
function pasteDayTasks(pid,di){
  if(!(dayClipboard&&dayClipboard.mode==='day'&&dayClipboard.tasks&&dayClipboard.tasks.length)) return false;
  var existing=getDayTasks(pid,di);
  if(existing.length&&!sameJSON(existing,dayClipboard.tasks)){
    if(!confirm('Remplacer les tâches déjà encodées pour '+pinfo(pid).nom+' — '+DAYS[di]+' '+fmtD(dayDate(di),true)+' ?')) return false;
  }
  var changed=setDayTasks(pid,di,clone(dayClipboard.tasks),{undoLabel:'Collage de journée — '+pinfo(pid).nom+' '+DAYS[di]});
  if((currentTab==='planning'||currentTab==='planning_be')) renderPlanning();
  if(currentTab==='myplan') renderMyPlan();
  if(currentTab==='pointage') renderPointage();
  updateStatusBar();
  if(changed) toast('✓ Journée collée');
  else toast('Journée identique, rien à changer');
  return changed;
}
function copyTaskAt(pid,di,taskIndex){
  var tasks=getDayTasks(pid,di), t=tasks[taskIndex];
  if(!t){toast('Aucune tâche à copier'); return false;}
  dayClipboard={mode:'task',task:clone(t),source:{pid:pid,di:di,taskId:t.id,wk:wkKey()},label:pinfo(pid).nom+' — '+DAYS[di]+' — '+taskDesc(t)};
  updateStatusBar();
  if((currentTab==='planning'||currentTab==='planning_be')) renderPlanning();
  toast('📋 Tâche copiée — cliquez une autre date pour coller');
  return true;
}
function pasteTaskAt(pid,di){
  if(!(dayClipboard&&dayClipboard.mode==='task'&&dayClipboard.task)) return false;
  var tasks=getDayTasks(pid,di);
  var copy=clone(dayClipboard.task); copy.id=uid();
  tasks.push(copy);
  var changed=setDayTasks(pid,di,tasks,{undoLabel:'Collage de tâche — '+pinfo(pid).nom+' '+DAYS[di]});
  if((currentTab==='planning'||currentTab==='planning_be')) renderPlanning();
  if(currentTab==='myplan') renderMyPlan();
  if(currentTab==='pointage') renderPointage();
  updateStatusBar();
  if(changed) toast('✓ Tâche collée');
  return changed;
}
function deleteTaskAt(pid,di,taskIndex){
  var tasks=getDayTasks(pid,di);
  if(taskIndex<0||taskIndex>=tasks.length){toast('Aucune tâche à supprimer'); return false;}
  var removed=clone(tasks[taskIndex]);
  tasks.splice(taskIndex,1);
  var changed=setDayTasks(pid,di,tasks,{undoLabel:'Suppression de tâche — '+pinfo(pid).nom+' '+DAYS[di]});
  if(dayClipboard&&dayClipboard.mode==='task'&&sameClipboardSource(pid,di,removed.id)) dayClipboard=null;
  if((currentTab==='planning'||currentTab==='planning_be')) renderPlanning();
  if(currentTab==='myplan') renderMyPlan();
  if(currentTab==='pointage') renderPointage();
  updateStatusBar();
  if(changed) toast('🗑 Tâche supprimée');
  return changed;
}
function deleteDayTasks(pid,di){
  var tasks=getDayTasks(pid,di);
  if(!tasks.length){toast('Aucune tâche à supprimer'); return false;}
  var changed=setDayTasks(pid,di,[],{undoLabel:'Suppression de journée — '+pinfo(pid).nom+' '+DAYS[di]});
  if(sameClipboardSource(pid,di)) dayClipboard=null;
  if((currentTab==='planning'||currentTab==='planning_be')) renderPlanning();
  if(currentTab==='myplan') renderMyPlan();
  if(currentTab==='pointage') renderPointage();
  updateStatusBar();
  if(changed) toast('🗑 Journée supprimée');
  return changed;
}
function handleTaskBlockClick(ev,pid,di,taskIndex){
  if(ev&&ev.stopPropagation) ev.stopPropagation();
  if(ev&&ev.altKey){deleteTaskAt(pid,di,taskIndex); return false;}
  if(ev&&(ev.ctrlKey||ev.metaKey)){copyTaskAt(pid,di,taskIndex); return false;}
  if(dayClipboard&&dayClipboard.mode==='task'&&!sameClipboardSource(pid,di,getDayTasks(pid,di)[taskIndex]&&getDayTasks(pid,di)[taskIndex].id)) return pasteTaskAt(pid,di);
  openDayModal(pid,di);
  return false;
}
function handleDayCellClick(ev,pid,di){
  if(ev&&ev.altKey){toast('Alt+clic directement sur un bloc coloré pour supprimer cette tâche'); return false;}
  if(dayClipboard&&dayClipboard.mode==='task'&&!sameClipboardSource(pid,di)) return pasteTaskAt(pid,di);
  if(ev&&(ev.ctrlKey||ev.metaKey)){
    if(dayClipboard&&dayClipboard.mode==='day'&&!sameClipboardSource(pid,di)) return pasteDayTasks(pid,di);
    return copyDayTasks(pid,di);
  }
  if(dayClipboard&&dayClipboard.mode==='day'&&!sameClipboardSource(pid,di)) return pasteDayTasks(pid,di);
  openDayModal(pid,di);
  return false;
}
function renderPlanning(){

  var p=pinfo(pid), col=tcol(p.g), html='<div class="pointage-wrap"><div class="summary-card" style="border-left:4px solid '+col+'"><div><b>'+p.nom+'</b><div style="font-size:12px;color:#64748b">Planning '+(isBureauContext()?'B.E. ':'')+'semaine '+isoWeek(wkMon)+'</div></div><div class="person-actions"><button class="mini-btn" onclick="showTab(\'personnel\')">Changer</button><button class="mini-btn" onclick="showTab(\'pointage\')">Pointer</button></div></div><div class="readonly-note">Lecture seule sur GSM.</div>';
  var has=false;
  for(var di=0;di<6;di++){
    var tasks=getDayTasks(pid,di), total=plannedDayTotal(pid,di); has=has||!!tasks.length;
    html+='<div class="day-block"><div class="day-title">'+DAYS[di]+' '+fmtD(dayDate(di),true)+'<span class="r">'+fmtH(total)+'</span></div>';

    else tasks.forEach(function(t){var c=taskColor(t), txt=taskDisplayLabel(t,true); html+='<div class="task-row" style="background:'+c.bg+';border-left:5px solid '+c.brd+'"><div class="task-info"><b>'+txt+'</b></div></div>';});
    html+='</div>';
  }
  if(!has) html+='<div class="empty-block" style="text-align:center">Aucune tâche planifiée cette semaine.</div>';
  el.innerHTML=html+'</div>';
}
function applyCompanyAbsence(type){

function addEditorTask(arg){

  var type=(arg==='absence')?'V':baseType;
  var remain=Math.max(0.25,roundQuarter(8-editorTotal()));
  var task=sanitizeTask({type:type,h:remain,colorIdx:(NOCH[type]?null:0)});
  if(insertAfter===null||insertAfter===undefined) editorTasks.push(task);
  else editorTasks.splice(insertAfter+1,0,task);
  renderEditor();
}
function addSuggestedTask(idx){

function setEditorField(i,f,v){editorTasks[i][f]=v;}

function clearEditorDay(){if(!confirm('Effacer toutes les tâches de ce jour ?')) return; editorTasks=[]; renderEditor();}
function saveEditorDay(){
  if(!editDay) return;
  editorTasks=editorTasks.map(sanitizeTask).filter(function(t){return t.h>0;});
  editorTasks.forEach(function(t){if(!NOCH[t.type]&&t.num&&t.colorIdx!==null&&t.colorIdx!==undefined)cColorOverride[t.num]=t.colorIdx;});

  html+=`<div class="setting-addbar"><button onclick="addPersonToGroup('M')">+ Machine</button><button onclick="addPersonToGroup('A')">+ Atelier</button><button onclick="addPersonToGroup('F')">+ Finition</button><button onclick="addPersonToGroup('T')">+ Transport</button><button onclick="addPersonToGroup('P')">+ Pose</button><button onclick="addPersonToGroup('G')">+ Magasin</button><button onclick="addPersonToGroup('B')">+ Bureau</button></div>`;
  html+='<div class="setting-row pers-head"><div style="width:32px"></div><div class="person-editor person-editor-head"><div>Nom</div><div>Section</div><div>Type par défaut</div><div>E-mail Firebase</div><div>N° GSM</div><div>Statut</div></div></div>';
  PERS.forEach(function(p){
    var on=p.active!==false;
    var col=tcol(p.g);
    var opts=['M','A','F','T','P','G','B'].map(function(g){return `<option value="${g}" ${p.g===g?'selected':''}>${sectionLabel(g)}</option>`;}).join('');
    var dtOpts='<option value="">—</option>'+TYPES.filter(function(t){return !NOCH[t.id];}).map(function(t){return `<option value="${t.id}" ${p.defaultType===t.id?'selected':''}>${t.lbl}</option>`;}).join('');
    var toggle='<button class="toggle-active '+(on?'on':'off')+'" onclick="togglePersonActive(\''+p.id+'\')" title="'+(on?'Actif':'Inactif')+'"><span class="knob"></span><span class="lbl">'+(on?'Actif':'Inactif')+'</span></button>';
    html+=`<div class="setting-row${on?'':' row-inactive'}"><div class="user-avatar-sm" style="background:${col}">${p.nom.charAt(0)}</div><div class="person-editor"><input value="${escAttr(p.nom)}" placeholder="Nom" onchange="updatePersonField('${p.id}','nom',this.value)" /><select onchange="updatePersonSection('${p.id}',this.value)">${opts}</select><select title="Type par défaut (— = automatique selon la section)" onchange="updatePersonDefaultType('${p.id}',this.value)">${dtOpts}</select><input value="${escAttr(p.email||'')}" placeholder="e-mail Firebase" type="email" onchange="updatePersonEmail('${p.id}',this.value)" /><input value="${escAttr(p.gsm||'')}" placeholder="N° GSM" onchange="updatePersonField('${p.id}','gsm',this.value)" />${toggle}</div></div>`;
  });
  html+=`</div>`;
  el.innerHTML=html;
  loadBureauRoles();
}
function loadBureauRoles(){
  var box=document.getElementById('bureau-roles-list'); if(!box) return;
  if(!db){box.innerHTML='<div style="font-size:12px;color:#94a3b8;padding:6px 0">Firebase non connecté.</div>'; return;}
  db.ref('data/userRoles').once('value').then(function(snap){
    var roles=snap.val()||{};
    var seenEmails={};
    var rows=[];
    Object.keys(roles).forEach(function(k){var v=roles[k]; if(v && v.email){seenEmails[v.email.toLowerCase()]=1; rows.push({key:k,email:v.email,role:v.role||'chef',connected:true});}});
    Object.keys(INITIAL_EMAIL_ROLES).forEach(function(em){if(!seenEmails[em.toLowerCase()]){rows.push({key:sanitizeEmailKey(em),email:em,role:INITIAL_EMAIL_ROLES[em],connected:false});}});
    rows.sort(function(a,b){if(a.role!==b.role) return a.role==='admin'?-1:1; return a.email.localeCompare(b.email);});
    if(!rows.length){box.innerHTML='<div style="font-size:12px;color:#94a3b8;padding:6px 0">Aucun compte autorisé.</div>'; return;}
    var html='';
    rows.forEach(function(r){
      var roleBadge=r.role==='admin'?'<span class="pin-tag" style="background:#fef3c7;border-color:#fcd34d;color:#92400e">👑 Admin</span>':'<span class="pin-tag" style="background:#dbeafe;border-color:#93c5fd;color:#1d4ed8">👔 Chef</span>';
      var statusBadge=r.connected?'':' <span class="pin-tag">Pas encore connecté</span>';
      var tools='';
      if(isAdmin() && (bureauUser&&bureauUser.email!==r.email)){
        if(r.role==='admin') tools='<button class="mini-btn" onclick="changeBureauRole(\''+escAttr(r.key)+'\',\''+escAttr(r.email)+'\',\'chef\')">↓ Chef</button>';
        else tools='<button class="mini-btn" onclick="changeBureauRole(\''+escAttr(r.key)+'\',\''+escAttr(r.email)+'\',\'admin\')">↑ Admin</button>';
        tools+='<button class="mini-btn" style="color:#dc2626" onclick="removeBureauRole(\''+escAttr(r.key)+'\',\''+escAttr(r.email)+'\')">Retirer</button>';
      }
      html+='<div class="setting-row"><div class="user-avatar-sm" style="background:'+(r.role==='admin'?'#92400e':'#1a3a5c')+'">'+escAttr(r.email).charAt(0).toUpperCase()+'</div><div class="meta"><b>'+escAttr(r.email)+'</b><span>'+roleBadge+statusBadge+'</span></div><div class="person-tools">'+tools+'</div></div>';
    });
    box.innerHTML=html;
  }).catch(function(){box.innerHTML='<div style="font-size:12px;color:#dc2626;padding:6px 0">Erreur de lecture Firebase.</div>';});
}
function addBureauRole(){
  if(!isAdmin()){toast('Réservé aux admins'); return;}
  var em=prompt('E-mail à pré-autoriser :\n\n(Le compte doit aussi être créé dans la console Firebase.)');
  if(!em) return; em=String(em).trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){toast('E-mail invalide'); return;}
  var r=prompt('Rôle ? (tapez "admin" ou "chef")','chef');
  if(!r) return; r=String(r).trim().toLowerCase(); if(r!=='admin'&&r!=='chef'){toast('Rôle invalide'); return;}
  var key=sanitizeEmailKey(em);
  db.ref('data/userRoles/'+key).set({email:em,role:r,nom:em.split('@')[0]}).then(function(){toast('Compte pré-autorisé'); loadBureauRoles();}).catch(function(){toast('Erreur Firebase');});
}
function changeBureauRole(key,email,newRole){
  if(!isAdmin()){toast('Réservé aux admins'); return;}
  if(!confirm('Changer le rôle de '+email+' en '+(newRole==='admin'?'admin':'chef')+' ?')) return;
  db.ref('data/userRoles/'+key).update({role:newRole}).then(function(){toast('Rôle mis à jour'); loadBureauRoles();}).catch(function(){toast('Erreur Firebase');});
}
function removeBureauRole(key,email){
  if(!isAdmin()){toast('Réservé aux admins'); return;}
  if(!confirm('Retirer '+email+' de la liste des comptes autorisés ?')) return;
  db.ref('data/userRoles/'+key).remove().then(function(){toast('Compte retiré'); loadBureauRoles();}).catch(function(){toast('Erreur Firebase');});
}
function addChefUser(targetRole){
  targetRole=(targetRole==='admin')?'admin':'chef';
  if(targetRole==='admin'){
    if(!isAdmin()){toast('Seul un admin peut ajouter un admin'); return;}
    if(adminCount()>=2){toast('Maximum 2 admins'); return;}
  }
  var nom=prompt('Nom du nouvel accès '+(targetRole==='admin'?'admin':'chef')+' :',''); if(!nom) return;
  var id='chef_'+Date.now().toString(36);
  chefUsers.push({id:id,nom:String(nom).trim(),pin:DEFAULT_CHEF_PIN,role:targetRole});
  addHistoryEntry('Ajout accès '+targetRole+' : '+nom); lsSave(); fbSave(); renderSettings(); toast('Accès ajouté avec PIN par défaut '+DEFAULT_CHEF_PIN);
}
function setChefRole(id,newRole){
  if(!isAdmin()){toast('Seul un admin peut changer les rôles'); return;}
  var c=chefInfo(id); if(!c) return;
  newRole=(newRole==='admin')?'admin':'chef';
  if(newRole==='admin'&&adminCount()>=2){toast('Maximum 2 admins'); return;}
  if(newRole==='chef'&&c.role==='admin'&&adminCount()<=1){toast('Gardez au moins un admin'); return;}
  var before=clone(c); c.role=newRole;
  addHistoryEntry('Changement de rôle : '+c.nom+' → '+(newRole==='admin'?'Admin':'Chef'),before,c);
  lsSave(); fbSave(); renderSettings(); updateStatusBar(); toast('Rôle modifié');
}
function renameChefUser(id){var c=chefInfo(id); if(!c) return; if(c.role==='admin'&&!isAdmin()){toast('Seul un admin peut modifier un admin'); return;} var nom=prompt('Nouveau nom :',c.nom); if(!nom) return; var before=clone(c); c.nom=nom; addHistoryEntry('Renommage accès : '+before.nom+' → '+nom,before,c); lsSave(); fbSave(); renderSettings(); updateHeader(); updateStatusBar();}
function deleteChefUser(id){var c=chefInfo(id); if(!c) return; if(c.role==='admin'&&!isAdmin()){toast('Seul un admin peut supprimer un admin'); return;} if(c.role==='admin'&&adminCount()<=1){toast('Gardez au moins un admin'); return;} if(chefUsers.length<=1){toast('Gardez au moins un accès'); return;} if(!confirm('Supprimer l\'accès de '+c.nom+' ?')) return; var idx=chefUsers.findIndex(function(x){return x.id===id;}); if(idx<0) return; var before=clone(chefUsers[idx]); chefUsers.splice(idx,1); addHistoryEntry('Suppression accès : '+before.nom,before,null); lsSave(); fbSave(); renderSettings();}
function addPersonToGroup(group){
  var nom=prompt('Nom de la personne à ajouter dans '+sectionLabel(group)+' :','');
  if(!nom) return;
  var gsm=prompt('N° de GSM (optionnel) :','')||'';
  var p=normalizePerson({id:makePersonId(nom),nom:nom,g:group,poste:sectionLabel(group),gsm:gsm},PERS.length);
  PERS.push(p); sortPeople();
  addHistoryEntry('Ajout personnel : '+p.nom+' — '+sectionLabel(group),null,p);
  lsSave(); fbSave(); renderSettings(); buildUserList(); if((currentTab==='planning'||currentTab==='planning_be')) renderPlanning(); if(currentTab==='pointage') renderPointage(); updateStatusBar(); toast('Personne ajoutée');
}
function updatePersonField(pid,field,value){
  var p=pinfo(pid); if(!p||!p.id) return; var before=clone(p); p[field]=String(value||'').trim();
  if(field==='nom' && !p[field]){toast('Le nom ne peut pas être vide'); p[field]=before[field]; renderSettings(); return;}
  addHistoryEntry('Mise à jour personnel : '+before.nom+' — '+field,before,p);
  lsSave(); fbSave(); if(currentTab==='settings') renderSettings(); buildUserList(); if((currentTab==='planning'||currentTab==='planning_be')) renderPlanning(); if(currentTab==='pointage') renderPointage(); updateHeader(); updateStatusBar();
}
function updatePersonSection(pid,g){
  var p=pinfo(pid); if(!p||!p.id) return; var before=clone(p); p.g=String(g||'P').toUpperCase(); p.poste=sectionLabel(p.g); sortPeople();
  addHistoryEntry('Changement de section : '+before.nom+' → '+sectionLabel(p.g),before,p);
  lsSave(); fbSave(); renderSettings(); buildUserList(); if((currentTab==='planning'||currentTab==='planning_be')) renderPlanning(); if(currentTab==='pointage') renderPointage(); updateStatusBar();
}
function updatePersonDefaultType(pid,t){var p=pinfo(pid); if(!p||!p.id) return; var before=clone(p); t=String(t||'').toUpperCase(); if(t&&!(tinfo(t)&&tinfo(t).id===t)) t=''; p.defaultType=t; addHistoryEntry('Type par défaut : '+p.nom+' → '+(t?tinfo(t).lbl:'auto'),before,p); lsSave(); fbSave(); renderSettings(); updateStatusBar();}
function updatePersonEmail(pid,em){
  var p=pinfo(pid); if(!p||!p.id) return;
  em=String(em||'').trim().toLowerCase();
  if(em && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){toast('E-mail invalide'); renderSettings(); return;}
  if(em){for(var i=0;i<PERS.length;i++){if(PERS[i].id!==pid && PERS[i].email===em){toast('Cet e-mail est déjà utilisé par '+PERS[i].nom); renderSettings(); return;}}}
  var before=clone(p); p.email=em;
  addHistoryEntry('E-mail : '+p.nom+' → '+(em||'(vide)'),before,p);
  lsSave(); fbSave(); updateStatusBar();
}
function togglePersonActive(pid){var p=pinfo(pid); if(!p||!p.id) return; var before=clone(p); p.active=(p.active===false); sortPeople(); addHistoryEntry((p.active?'Activation':'Désactivation')+' personnel : '+p.nom,before,p); lsSave(); fbSave(); renderSettings(); buildUserList(); if((currentTab==='planning'||currentTab==='planning_be')) renderPlanning(); if(currentTab==='pointage') renderPointage(); updateStatusBar(); toast(p.nom+(p.active?' activé':' désactivé'));}

// ── PIN MODAL ────────────────────────────────────────────────
function pmLen(){return (pinEditTarget&&pinEditTarget.kind==='chef')?CHEF_PIN_LENGTH:PIN_LENGTH;}
function openPinModal(kind,id){pinEditTarget={kind:kind,id:id}; pinEditValue=''; var L=pmLen(); document.getElementById('pm-title').textContent=(kind==='chef'?'PIN chef / admin':'PIN personnel'); document.getElementById('pm-hint').textContent='Entrez un code à '+L+' chiffres'; document.getElementById('pm-error').textContent=''; updatePmDisplay(); buildPmPad(); document.getElementById('pin-ov').classList.add('on');}
function buildPmPad(){var pp=document.getElementById('pm-pad'); pp.innerHTML=''; [1,2,3,4,5,6,7,8,9,'',0,'⌫'].forEach(function(v){var b=document.createElement('button'); b.className='pm-btn'; b.textContent=String(v); if(v==='') b.style.visibility='hidden'; else b.onclick=function(){pressPm(v);}; pp.appendChild(b);});}
function pressPm(v){var L=pmLen(); if(v==='⌫') pinEditValue=pinEditValue.slice(0,-1); else if(pinEditValue.length<L) pinEditValue+=String(v); updatePmDisplay(); document.getElementById('pm-error').textContent='';}
function updatePmDisplay(){var L=pmLen(); for(var i=0;i<6;i++){var d=document.getElementById('pd'+i); if(!d) continue; d.style.display=(i<L)?'block':'none'; d.classList.toggle('filled',i<pinEditValue.length);}}
function savePinModal(){if(!pinEditTarget) return; var L=pmLen(); if(pinEditValue.length!==L){document.getElementById('pm-error').textContent=L+' chiffres requis'; return;} if(pinEditTarget.kind==='chef'){var c=chefInfo(pinEditTarget.id); if(c){if(c.role==='admin'&&!isAdmin()){toast('Seul un admin peut modifier un admin'); closePinModal(); return;} var before=clone(c); c.pin=pinEditValue; addHistoryEntry('Mise à jour PIN : '+c.nom,before,c);}} else {var pid=pinEditTarget.id, beforeP=personPins[pid]||null; personPins[pid]=pinEditValue; addHistoryEntry('Mise à jour PIN personnel : '+pinfo(pid).nom,beforeP,pinEditValue);} lsSave(); fbSave(); renderSettings(); closePinModal(); toast('PIN enregistré');}
function closePinModal(e){if(e&&e.target!==document.getElementById('pin-ov')) return; document.getElementById('pin-ov').classList.remove('on'); pinEditTarget=null; pinEditValue='';}

// ── HISTORY ──────────────────────────────────────────────────
function renderHistory(){var list=document.getElementById('hist-list'); if(!list) return; appMeta=ensureMeta(appMeta); if(!appMeta.history.length){list.innerHTML='<div class="hist-empty">Aucune modification enregistrée.</div>'; return;} list.innerHTML=appMeta.history.map(function(h){return '<div class="hist-item"><div class="hist-top"><div class="hist-by">'+(h.by||'')+'</div><div class="hist-at">'+fmtDT(h.at)+'</div></div><div class="hist-text">'+(h.text||'')+'</div></div>';}).join('');}
function openHist(){renderHistory(); document.getElementById('hist-ov').classList.add('on');}
function closeHist(e){if(e&&e.target!==document.getElementById('hist-ov')) return; document.getElementById('hist-ov').classList.remove('on');}
function renderHistoryIfOpen(){var ov=document.getElementById('hist-ov'); if(ov&&ov.classList.contains('on')) renderHistory();}

// ── EXPORT / IMPORT ──────────────────────────────────────────
function renderExport(){
  var el=document.getElementById('tab-export'); if(!el) return;
  el.innerHTML='<div class="ex-card" style="padding:16px"><h3 style="font-size:14px;color:var(--bleu);margin-bottom:6px">💾 Sauvegarder</h3><p style="font-size:12px;color:#64748b;margin-bottom:10px">Exporte la totalité du planning, du pointage, des PIN et des accès chef.</p><button class="main-btn" onclick="doSaveJSON()">Télécharger le fichier JSON</button></div>'
  +'<div class="ex-card" style="padding:16px"><h3 style="font-size:14px;color:var(--bleu);margin-bottom:6px">📂 Charger</h3><p style="font-size:12px;color:#64748b;margin-bottom:10px">Recharge une sauvegarde JSON.</p><input type="file" id="import-file" accept=".json" style="display:none" onchange="doLoadJSON(this)"/><button class="secondary-btn" onclick="document.getElementById(\'import-file\').click()">Choisir un fichier JSON</button></div>'
  +'<div class="ex-card" style="padding:16px"><h3 style="font-size:14px;color:var(--bleu);margin-bottom:6px">📊 Export CSV</h3><p style="font-size:12px;color:#64748b;margin-bottom:10px">Exporte les heures pointées.</p><button class="main-btn" onclick="doExportCSV()">Télécharger le CSV</button></div>'
  +'<div class="ex-card" style="padding:16px"><h3 style="font-size:14px;color:var(--bleu);margin-bottom:6px">🖨 Imprimer</h3><p style="font-size:12px;color:#64748b;margin-bottom:10px">Impression / PDF en couleur avec une mise en page proche de l’écran.</p><button class="main-btn" onclick="doPrint()">Imprimer / PDF</button></div>';
}
function doSaveJSON(){var data={version:8,savedAt:new Date().toISOString(),planning:planning,pointage:pointage,cColorOverride:cColorOverride,people:PERS,personPins:personPins,chefUsers:chefUsers,meta:appMeta}; var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}); var url=URL.createObjectURL(blob); var a=document.createElement('a'); a.href=url; a.download='planning_verbruggen_S'+isoWeek(wkMon)+'_'+new Date().toISOString().slice(0,10)+'.json'; document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(function(){URL.revokeObjectURL(url);},1000); toast('Sauvegarde téléchargée');}
function doLoadJSON(input){var file=input.files[0]; if(!file) return; var r=new FileReader(); r.onload=function(ev){try{var d=JSON.parse(ev.target.result); if(d.planning) planning=d.planning; if(d.pointage) pointage=d.pointage; if(d.extraPointage) legacyExtraPointage=d.extraPointage; if(d.cColorOverride) cColorOverride=d.cColorOverride; if(d.people) PERS=d.people; if(d.personPins) personPins=d.personPins; if(d.chefUsers) chefUsers=d.chefUsers; else if(d.chefPin) chefUsers=[{id:'chef_main',nom:'Chef principal',pin:padPin(d.chefPin)||DEFAULT_CHEF_PIN}]; if(d.meta) appMeta=ensureMeta(d.meta); migrateState(); lsSave(); fbSave(); renderCurrentTab(); updateStatusBar(); toast('Sauvegarde chargée');}catch(e){toast('Fichier invalide');}}; r.readAsText(file); input.value='';}
function doExportCSV(){
  var rows=[['Semaine','Personne','Jour','Date','Type','N Chantier','Client','LOT','Heures prévues','Heures pointées','Nature']];
  PERS.forEach(function(p){for(var di=0;di<6;di++){syncPointageDay(p.id,di,true); var day=getPointageDay(p.id,di); (day.items||[]).forEach(function(it){rows.push([isoWeek(wkMon),p.nom,DAYS[di],fmtD(dayDate(di),true),it.type,it.num||'',it.nom||'',it.mbl||'',roundQuarter(it.plannedH||0),roundQuarter(it.h||0),'planning']);}); (day.extras||[]).forEach(function(it){rows.push([isoWeek(wkMon),p.nom,DAYS[di],fmtD(dayDate(di),true),'',it.num||'',it.nom||'',it.mbl||'',0,roundQuarter(it.h||0),'imprévu']);}); }});
  var csv=rows.map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"';}).join(';');}).join('\r\n');
  var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}); var url=URL.createObjectURL(blob); var a=document.createElement('a'); a.href=url; a.download='pointage_S'+isoWeek(wkMon)+'.csv'; document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(function(){URL.revokeObjectURL(url);},1000); toast('CSV téléchargé');
}
function doPrint(){
  renderPlanning();
  var src=document.getElementById('tab-planning');
  if(!src){toast('Aucun planning à imprimer'); return;}
  var styleHtml='';
  document.querySelectorAll('style').forEach(function(st){styleHtml+=st.innerHTML+'\n';});
  var printCss='@page{size:A3 landscape;margin:8mm} html,body{height:auto!important;overflow:visible!important;background:#fff!important} body{margin:0;padding:0;background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact} *{-webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact} #print-root{padding:0} .table-wrap{overflow:visible!important} #ptbl{min-width:0!important;width:100%!important;table-layout:fixed!important} #ptbl th,#ptbl td{page-break-inside:avoid} #ptbl th{position:static!important;top:auto!important} #ptbl th.pname,#ptbl td.pname,#ptbl td.weektotal{position:static!important;left:auto!important;right:auto!important} .top-actions,.week-hint{break-inside:avoid-page} button{cursor:default}';
  var html='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Planning semaine '+isoWeek(wkMon)+'</title><style>'+styleHtml+'\n'+printCss+'</style></head><body><div id="print-root">'+src.innerHTML+'</div></body></html>';
  var win=window.open('','_blank','width=1600,height=900');
  if(!win){toast('Autorisez les fenêtres popup pour imprimer'); return;}
  win.document.write(html);
  win.document.close();
  win.onload=function(){setTimeout(function(){win.focus(); win.print();},350);};
}

document.addEventListener('keydown', function(e){
  var tag=(document.activeElement&&document.activeElement.tagName||'').toLowerCase();
  var typing=(tag==='input'||tag==='textarea'||tag==='select'||(document.activeElement&&document.activeElement.isContentEditable));
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&String(e.key||'').toLowerCase()==='z'&&!typing){e.preventDefault(); undoLast(); return;}
  if(e.key==='Escape'){closeDayModal(); closePinModal(); closeHist(); clearDayClipboard(true);}
